units:
  - name: input
    width: 1
    roles:
      - name: ALU
        usesMem: False
    readLock: True
  - name: output 1
    width: 1
    roles:
      - name: ALU
        usesMem: False
    writeLock: True
  - name: middle
    width: 1
    roles:
      - name: ALU
        usesMem: False
  - name: output 2
    width: 1
    roles:
      - name: MEM
        usesMem: False
    writeLock: True
dataPath:
  - [input, output 1]
  - [input, middle]
  - [middle, output 2]

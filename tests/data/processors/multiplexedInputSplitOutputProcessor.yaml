units:
  - name: input
    width: 2
    roles:
      - name: ALU
        usesMem: False
      - name: MEM
        usesMem: False
    readLock: True
  - name: ALU output
    width: 1
    roles:
      - name: ALU
        usesMem: False
    writeLock: True
  - name: MEM output
    width: 1
    roles:
      - name: MEM
        usesMem: False
    writeLock: True
dataPath:
  - [input, ALU output]
  - [input, MEM output]

units:
  - name: input
    width: 1
    roles:
      - name: ALU
        usesMem: False
    readLock: True
  - name: middle
    width: 1
    roles:
      - name: ALU
        usesMem: False
  - name: output
    width: 1
    roles:
      - name: ALU
        usesMem: False
    writeLock: True
dataPath:
  - [input, middle]
  - [middle, output]
